groups:
  - name: posnet-critical
    rules:
      # Saga completa detenida: entran transacciones pero ninguna se aprueba.
      # Causa probable: error en Authorization, Fraud o Acquirer.
      - alert: SagaCompletaDetenida
        expr: |
          rate(posnet_transactions_approved_total[5m]) == 0
          and rate(posnet_transactions_received_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Saga detenida: entran transacciones pero ninguna se aprueba"
          description: "rate(approved[5m])==0 con rate(received[5m])>0 por 2m. Revisar Authorization, Fraud y Acquirer."

      # Error rate alto: demasiadas transacciones rechazadas.
      # Causa probable: fraude masivo o bug en validación.
      - alert: ErrorRateAlta
        expr: |
          rate(posnet_transactions_rejected_total[5m])
          / rate(posnet_transactions_received_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Error rate > 10% en Authorization"
          description: "rejected/received > 0.1 por 5m ({{ $value | humanizePercentage }}). Posible fraude masivo o bug de validación."

      # Fraud Detection no responde a tiempo: Authorization rechaza esas ventas con FRAUD_TIMEOUT.
      # Con el motor caído, se rechazan todas. Investigar: Fraud Detection, su consumidor de
      # fraud.check-requested y NATS.
      - alert: FraudCheckSinRespuesta
        expr: sum(increase(posnet_transactions_rejected_total{rejection_code="FRAUD_TIMEOUT"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Unas {{ printf "%.0f" $value }} ventas rechazadas sin score de fraude en 5 minutos'
          description: "Fraud Detection no respondió dentro de FRAUD_CHECK_TIMEOUT y Authorization las rechazó con FRAUD_TIMEOUT. Revisar Fraud Detection, su consumidor de fraud.check-requested y NATS."

      # Pool de Postgres agotado: casi todas las conexiones prestadas.
      # Causa probable: queries lentas o conexiones leakeadas.
      - alert: PoolPostgresAgotado
        expr: pgx_pool_acquired_conns / pgx_pool_max_conns > 0.95
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Pool pgx agotado en {{ $labels.bc }}"
          description: "acquired/max > 0.95 por 1m en {{ $labels.bc }}. Queries lentas o conexiones leakeadas."

      # Sesiones bloqueadas en PROCESSING: gauge de sesiones en curso ahora mismo.
      # Causa probable: saga atascada — AuthApproved no llega.
      - alert: SesionesBloqueadasProcessing
        expr: posnet_sessions_processing_current > 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Sesiones atascadas en PROCESSING"
          description: "posnet_sessions_processing_current > 10 por 2m. Saga atascada: AuthApproved no llega."

      # Deadlock en Postgres: contención en TX SERIALIZABLE (Settlement).
      # Requiere postgres_exporter. Cualquier deadlock merece investigación.
      - alert: PostgresDeadlock
        expr: increase(pg_stat_database_deadlocks{datname="posnet"}[1m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Deadlock detectado en Postgres (db posnet)"
          description: "increase(pg_stat_database_deadlocks[1m]) > 0. Contención probable en la TX SERIALIZABLE de Settlement."

      # Evento de Settlement que agotó las entregas: una venta, reversa o cierre sin registrar.
      # Compara contra 0 y no usa increase() porque el primer incremento de un counter
      # no se ve: queda activa hasta reprocesar el evento y reiniciar el servicio.
      - alert: EventoSettlementPerdido
        expr: sum by (subject) (posnet_nats_messages_failed_total{bc="settlement",kind="exhausted"}) > 0
        labels:
          severity: critical
        annotations:
          summary: "Settlement agotó las entregas de {{ $labels.subject }}"
          description: "Un evento no se reintentará y falta en los lotes. Buscar 'deliveries exhausted' en los logs y seguir nats-dlq-reprocess.md."

