groups:
  - name: posnet-warning
    rules:
      # Latencia de saga alta: p95 por encima de 3s.
      # Investigar: fraud engine lento o acquirer con latencia alta.
      - alert: LatenciaSagaAlta
        expr: histogram_quantile(0.95, sum(rate(posnet_saga_duration_seconds_bucket[5m])) by (le)) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Saga p95 > 3s"
          description: "histogram_quantile(0.95, saga_duration) > 3s por 5m ({{ $value | humanizeDuration }}). Revisar fraud engine y acquirer."

      # Duplicados NATS altos: muchas redeliveries descartadas por idempotencia.
      # Investigar: AckWait muy corto o crash loops en BCs.
      - alert: DuplicadosNATSAltos
        expr: sum(rate(posnet_idempotency_duplicates_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tasa de duplicados NATS elevada"
          description: "rate(idempotency_duplicates[5m]) > 0.05 por 5m. AckWait muy corto o crash loops."

      # Cache de reglas de fraude poco efectivo: hit ratio < 90%.
      # Investigar: TTL del cache muy corto para el volumen de transacciones.
      - alert: CacheRulesLow
        expr: |
          sum(rate(posnet_fraud_rules_cache_hits_total[5m]))
          / (sum(rate(posnet_fraud_rules_cache_hits_total[5m]))
             + sum(rate(posnet_fraud_rules_cache_misses_total[5m]))) < 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cache de reglas de fraude con hit ratio < 90%"
          description: "hits/(hits+misses) < 0.9 por 10m ({{ $value | humanizePercentage }}). TTL del cache muy corto."

      # Sospecha de goroutine leak: crecimiento neto sostenido.
      # Investigar: goroutine no terminada en subscriber o handler.
      # NOTA: se usa delta() y no increase() (como en el doc §6.2). go_goroutines
      # es un GAUGE que sube y baja; increase() lo trata como counter y suma cada
      # bajada como si fuera un reset → falsos positivos permanentes (300-480 en
      # reposo). delta() = último - primero de la ventana, que es el crecimiento
      # neto real y no se dispara por restarts.
      - alert: GoroutineLeakSospechoso
        expr: delta(go_goroutines{job="posnet-bcs"}[10m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Posible goroutine leak en {{ $labels.bc }}"
          description: "increase(go_goroutines[10m]) > 100 por 5m en {{ $labels.bc }}. Revisar goroutines no terminadas."

      # Heap creciente: proyección lineal supera 500MB en 1h.
      # Investigar: posible memory leak — revisar pprof.
      - alert: HeapCreciente
        expr: predict_linear(go_memstats_heap_inuse_bytes{job="posnet-bcs"}[30m], 3600) > 500e6
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Heap con tendencia creciente en {{ $labels.bc }}"
          description: "predict_linear(heap[30m], 1h) > 500MB en {{ $labels.bc }}. Posible memory leak, revisar pprof."

      # Timeouts del motor de fraude: reglas con I/O lento (historyRepo).
      - alert: EvalTimeoutsFraud
        expr: rate(posnet_fraud_engine_timeouts_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Timeouts del motor de fraude elevados"
          description: "rate(fraud_engine_timeouts[5m]) > 0.01 por 5m. Regla con I/O lento (historyRepo)."

      # Scores de fraude sin salir a NATS: no se pierden, pero Authorization rechaza esas ventas
      # con FRAUD_TIMEOUT mientras tanto. Investigar: conexión a NATS y logs "outbox relay".
      - alert: OutboxFraudTrabado
        expr: max(posnet_fraud_outbox_stuck) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} scores trabados en el outbox de Fraud Detection"
          description: "Los scores no llegan a NATS. Se publicarán solos cuando se resuelva la causa, pero Authorization ya rechazó esas ventas con FRAUD_TIMEOUT. Revisar NATS y los logs 'outbox relay'."

      # Control de fraude apagado: sin reglas activas, todo se aprueba con score 0.
      - alert: FraudSinReglasActivas
        expr: max(posnet_fraud_active_rules) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Fraud Detection no tiene reglas activas"
          description: "Todas las ventas se aprueban con score 0. Si no fue intencional, reactivar las reglas en fraud_detection.fraud_rules."

      # Pedidos cuyo score no salió del motor. engine_failure: la venta pasa con REVIEW neutral.
      # invalid_event: se rechaza con REJECT. unanswerable: sin transaction_id, no se responde.
      - alert: FraudSinEvaluar
        expr: sum by (reason) (increase(posnet_fraud_unevaluated_total[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Unos {{ printf "%.0f" $value }} pedidos de fraude sin evaluar en 5 minutos ({{ $labels.reason }})'
          description: "engine_failure: el motor falla y las ventas pasan sin control (logs 'rule engine failed'). invalid_event o unanswerable: Authorization manda pedidos que no se pueden evaluar (logs 'cannot be evaluated' o 'without a valid transaction_id')."

      # Lotes en disputa: el cierre no coincide con el terminal y no se envían.
      # Investigar: docs/runbooks/batch-close-failure.md, Escenario A.
      - alert: LotesEnDisputa
        expr: max(posnet_settlement_batches_attention{reason="disputed"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} lotes en DISPUTED"
          description: "Hay lotes en disputa sin resolver hace 15m. Resolver con reopen o resolve-dispute (batch-close-failure.md, Escenario A)."

      # Lotes cerrados sin enviar: la métrica ya excluye la última hora y los lotes vacíos.
      # Investigar: docs/runbooks/batch-close-failure.md, Escenario C.
      - alert: LotesCerradosSinEnviar
        expr: max(posnet_settlement_batches_attention{reason="closed_unsent"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} lotes en CLOSED sin enviar"
          description: "Lotes con transacciones en CLOSED hace más de 1h. Revisar SETTLEMENT_PROCESSOR y usar resubmit (batch-close-failure.md, Escenario C)."

      # Lotes abiertos vencidos: el cierre automático debería haberlos cerrado.
      # Investigar: docs/runbooks/batch-close-failure.md, Escenario F.
      - alert: LotesAbiertosVencidos
        expr: max(posnet_settlement_batches_attention{reason="open_overdue"}) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} lotes OPEN de días anteriores"
          description: "El cierre automático no los cerró. Revisar que SETTLEMENT_BATCH_CLOSE_HOUR no sea 0 y los logs (batch-close-failure.md, Escenario F)."

      # Envíos que no llegaron al procesador: avisa antes que LotesCerradosSinEnviar.
      # Las series nacen en 0 al arrancar el servicio: increase() ve también el primer fallo.
      - alert: EnvioAlProcesadorFallando
        expr: sum by (result) (increase(posnet_settlement_submissions_total{result=~"unavailable|error"}[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Envíos al procesador con resultado {{ $labels.result }}"
          description: "unavailable: sin procesador configurado. error: el procesador falló. Los lotes quedan en CLOSED hasta un resubmit (batch-close-failure.md, Escenario C)."

      # Sin conexión, las ventas se rechazan con 91 y las reversas quedan pendientes.
      - alert: AdquirenteDesconectado
        expr: max(posnet_acquirer_connected) == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Sin conexión con el host adquirente"
          description: "Las ventas se rechazan con 91 y las reversas quedan pendientes hasta que vuelva. El servicio reconecta solo. Revisar el host y los logs 'acquirer host unreachable'."

      # Circuit breaker abierto: el host está conectado pero no responde, y las ventas se rechazan
      # con 91 sin llamarlo. Cada ACQUIRER_BREAKER_COOLDOWN prueba con una llamada.
      # Investigar: el host adquirente y los logs 'acquirer circuit'.
      - alert: CircuitoAdquirenteAbierto
        expr: max(posnet_acquirer_circuit_open) == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker del adquirente abierto"
          description: "El host no responde: las ventas se rechazan con 91 sin llamarlo, y se cierra solo cuando una llamada de prueba recibe respuesta. Revisar el host y los logs 'acquirer circuit'."

      # El conciliador las resuelve en menos de un minuto: si siguen, las reversas están fallando.
      # Investigar: docs/runbooks/incident-response.md, "Transacciones trabadas".
      - alert: TransaccionesSinResolver
        expr: max(posnet_authorization_unresolved_transactions) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} transacciones sin resultado conocido"
          description: "Sin resultado conocido o con una reversa pedida sin completar. Revisar el adquirente y los logs 'transaction not reconciled' y 'reversal not completed'."

      # Outbox de Authorization sin avanzar: los resultados no se pierden, pero no salen, así que
      # Terminal Gateway, Settlement y Notification no se enteran.
      # Investigar: conexión a NATS y logs "outbox relay".
      - alert: OutboxAuthorizationTrabado
        expr: max(posnet_authorization_outbox_stuck) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} eventos trabados en el outbox de Authorization"
          description: "Los resultados de las transacciones y fraud.check-requested no llegan a NATS. Se publicarán solos cuando se resuelva la causa. Revisar NATS y los logs 'outbox relay'."

      # Outbox de Settlement sin avanzar: los eventos no se pierden, pero no salen.
      # Investigar: conexión a NATS y logs "outbox relay".
      - alert: OutboxSettlementTrabado
        expr: max(posnet_settlement_outbox_stuck) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} eventos trabados en el outbox de Settlement"
          description: "batch-closed y settlement.completed no llegan a NATS. Se publicarán solos cuando se resuelva la causa. Revisar NATS y los logs 'outbox relay'."

      # Reversas que no coinciden con su compra. La métrica ya espera 15 minutos, para dar
      # tiempo a que llegue una compra demorada.
      # Investigar: docs/runbooks/batch-close-failure.md, Escenario H.
      - alert: ReversasEnRevision
        expr: max(posnet_settlement_reversals_in_review) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} reversas en revisión"
          description: "Hay reversas sin compra o que no coinciden con ella. Sus lotes no se envían hasta cerrar la revisión (batch-close-failure.md, Escenario H)."

      # Eventos que agotaron sus entregas, unos 12 minutos de reintentos, y esperan en la DLQ. No se
      # pierden, pero no cuentan hasta que alguien los reprocese.
      # Investigar: docs/runbooks/batch-close-failure.md, Escenario I.
      - alert: EventosEnDLQSettlement
        expr: max(posnet_settlement_dead_letters) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} eventos de Settlement en la DLQ"
          description: "Ventas, reversas o cierres que no se pudieron registrar. Revisar la causa (logs 'moved to the dead letter queue') y reprocesarlos con POST /dead-letters/{sequence}/replay (batch-close-failure.md, Escenario I)."

      # Un terminal informó ventas de un día en el que Settlement no tiene ningún lote. Terminal
      # Gateway ya le respondió 202: el terminal cree que cerró.
      # Investigar: docs/runbooks/batch-close-failure.md, Escenario B.
      - alert: CierreSinLote
        expr: sum(increase(posnet_settlement_batch_close_rejected_total{reason="no_batch"}[30m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Un terminal cerró con ventas que Settlement no tiene"
          description: "Las ventas pueden estar reintentándose o en la DLQ, o no haber llegado. Revisar el log 'terminal reported sales for a day without any batch' (batch-close-failure.md, Escenario B)."

      # Falta ejecutar settlement-recover-reversals en este entorno: puede haber ventas anuladas
      # antes de que se guardaran las reversas que siguen sumando. Se apaga sola cuando el comando
      # registra que no queda ninguna.
      # Investigar: docs/runbooks/batch-close-failure.md, Escenario E.
      - alert: ReversasSinRecuperar
        expr: max(posnet_settlement_reversal_recovery_pending) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Falta recuperar las reversas anteriores en Settlement"
          description: "settlement-recover-reversals no se ejecutó en este entorno, o dejó reversas sin registrar. Hasta entonces, ventas anuladas pueden seguir sumando (batch-close-failure.md, Escenario E)."

