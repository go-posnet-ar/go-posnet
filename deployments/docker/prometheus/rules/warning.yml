groups:
  - name: posnet-warning
    rules:
      # Latencia de saga alta: p95 por encima de 3s.
      # Investigar: fraud engine lento o acquirer con latencia alta.
      - alert: LatenciaSagaAlta
        expr: histogram_quantile(0.95, sum(rate(posnet_saga_duration_seconds_bucket[5m])) by (le)) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Saga p95 > 3s"
          description: "histogram_quantile(0.95, saga_duration) > 3s por 5m ({{ $value | humanizeDuration }}). Revisar fraud engine y acquirer."

      # Duplicados NATS altos: muchas redeliveries descartadas por idempotencia.
      # Investigar: AckWait muy corto o crash loops en BCs.
      - alert: DuplicadosNATSAltos
        expr: sum(rate(posnet_idempotency_duplicates_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tasa de duplicados NATS elevada"
          description: "rate(idempotency_duplicates[5m]) > 0.05 por 5m. AckWait muy corto o crash loops."

      # Cache de reglas de fraude poco efectivo: hit ratio < 90%.
      # Investigar: TTL del cache muy corto para el volumen de transacciones.
      - alert: CacheRulesLow
        expr: |
          sum(rate(posnet_fraud_rules_cache_hits_total[5m]))
          / (sum(rate(posnet_fraud_rules_cache_hits_total[5m]))
             + sum(rate(posnet_fraud_rules_cache_misses_total[5m]))) < 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cache de reglas de fraude con hit ratio < 90%"
          description: "hits/(hits+misses) < 0.9 por 10m ({{ $value | humanizePercentage }}). TTL del cache muy corto."

      # Sospecha de goroutine leak: crecimiento neto sostenido.
      # Investigar: goroutine no terminada en subscriber o handler.
      # NOTA: se usa delta() y no increase() (como en el doc §6.2). go_goroutines
      # es un GAUGE que sube y baja; increase() lo trata como counter y suma cada
      # bajada como si fuera un reset → falsos positivos permanentes (300-480 en
      # reposo). delta() = último - primero de la ventana, que es el crecimiento
      # neto real y no se dispara por restarts.
      - alert: GoroutineLeakSospechoso
        expr: delta(go_goroutines{job="posnet-bcs"}[10m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Posible goroutine leak en {{ $labels.bc }}"
          description: "increase(go_goroutines[10m]) > 100 por 5m en {{ $labels.bc }}. Revisar goroutines no terminadas."

      # Heap creciente: proyección lineal supera 500MB en 1h.
      # Investigar: posible memory leak — revisar pprof.
      - alert: HeapCreciente
        expr: predict_linear(go_memstats_heap_inuse_bytes{job="posnet-bcs"}[30m], 3600) > 500e6
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Heap con tendencia creciente en {{ $labels.bc }}"
          description: "predict_linear(heap[30m], 1h) > 500MB en {{ $labels.bc }}. Posible memory leak, revisar pprof."

      # Timeouts del motor de fraude: reglas con I/O lento (historyRepo).
      - alert: EvalTimeoutsFraud
        expr: rate(posnet_fraud_engine_timeouts_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Timeouts del motor de fraude elevados"
          description: "rate(fraud_engine_timeouts[5m]) > 0.01 por 5m. Regla con I/O lento (historyRepo)."

      # Lotes en disputa: el cierre no coincide con el terminal y no se envían.
      # Investigar: docs/runbooks/batch-close-failure.md, Escenario A.
      - alert: LotesEnDisputa
        expr: max(posnet_settlement_batches_attention{reason="disputed"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} lotes en DISPUTED"
          description: "Hay lotes en disputa sin resolver hace 15m. Resolver con reopen o resolve-dispute (batch-close-failure.md, Escenario A)."

      # Lotes cerrados sin enviar: la métrica ya excluye la última hora y los lotes vacíos.
      # Investigar: docs/runbooks/batch-close-failure.md, Escenario C.
      - alert: LotesCerradosSinEnviar
        expr: max(posnet_settlement_batches_attention{reason="closed_unsent"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} lotes en CLOSED sin enviar"
          description: "Lotes con transacciones en CLOSED hace más de 1h. Revisar SETTLEMENT_PROCESSOR y usar resubmit (batch-close-failure.md, Escenario C)."

      # Lotes abiertos vencidos: el cierre automático debería haberlos cerrado.
      # Investigar: docs/runbooks/batch-close-failure.md, Escenario F.
      - alert: LotesAbiertosVencidos
        expr: max(posnet_settlement_batches_attention{reason="open_overdue"}) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} lotes OPEN de días anteriores"
          description: "El cierre automático no los cerró. Revisar SETTLEMENT_BATCH_CLOSE_HOUR y los logs (batch-close-failure.md, Escenario F)."

      # Envíos que no llegaron al procesador: avisa antes que LotesCerradosSinEnviar.
      # El counter nace con el primer intento: ese primer incremento no lo ve increase().
      - alert: EnvioAlProcesadorFallando
        expr: sum by (result) (increase(posnet_settlement_submissions_total{result=~"unavailable|error"}[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Envíos al procesador con resultado {{ $labels.result }}"
          description: "unavailable: sin procesador configurado. error: el procesador falló. Los lotes quedan en CLOSED hasta un resubmit (batch-close-failure.md, Escenario C)."

      # Outbox de Settlement sin avanzar: los eventos no se pierden, pero no salen.
      # Investigar: conexión a NATS y logs "outbox relay".
      - alert: OutboxSettlementTrabado
        expr: max(posnet_settlement_outbox_stuck) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} eventos trabados en el outbox de Settlement"
          description: "batch-closed y settlement.completed no llegan a NATS. Se publicarán solos cuando se resuelva la causa. Revisar NATS y los logs 'outbox relay'."

